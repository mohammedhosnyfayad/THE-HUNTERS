<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .aa,
    .ww {
      background-color: transparent;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 6px solid transparent;
      position: relative;
    }
    .aa::before {
      position: absolute;
      content: attr(data-width);
      background-color: red;
      width: 10px;
      color: green;
      height: 10px;
      top: -15px;
      left: 50%;
      transform: translate(-50%);
    }
    .aa span {
      display: block;
      background-color: transparent;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      text-align: center;
      border-right: 6px solid transparent !important;
      border-top: 6px solid transparent !important;
      border: 6px solid gold;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .ww span {
      display: block;
      background-color: transparent;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      text-align: center;
      border-right: 6px solid transparent !important;
      border: 6px solid gold;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .big {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
  </style>
  <body>
    <div class="big">
      <div data-width="30" class="aa">
        <span></span>
      </div>
    </div>
  </body>
</html>
